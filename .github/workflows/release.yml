name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build universal app
        run: ./build.sh

      - name: Verify release
        run: |
          ditto -x -k dist/MediaPrimeKey.zip "$RUNNER_TEMP/MediaPrimeKey-release"
          RELEASE_APP="$RUNNER_TEMP/MediaPrimeKey-release/MediaPrimeKey.app"
          lipo -archs "$RELEASE_APP/Contents/MacOS/MediaPrimeKey" | grep -q arm64
          lipo -archs "$RELEASE_APP/Contents/MacOS/MediaPrimeKey" | grep -q x86_64
          codesign --verify --deep --strict "$RELEASE_APP"
          "$RELEASE_APP/Contents/MacOS/MediaPrimeKey" --self-test
          test "$(plutil -extract CFBundleShortVersionString raw "$RELEASE_APP/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MediaPrimeKey.zip \
            --title "MediaPrimeKey ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
