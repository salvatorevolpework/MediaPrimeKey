name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Verify release
        run: |
          lipo -archs dist/MediaPrimeKey.app/Contents/MacOS/MediaPrimeKey | grep -q arm64
          lipo -archs dist/MediaPrimeKey.app/Contents/MacOS/MediaPrimeKey | grep -q x86_64
          codesign --verify --deep --strict dist/MediaPrimeKey.app
          dist/MediaPrimeKey.app/Contents/MacOS/MediaPrimeKey --self-test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MediaPrimeKey.zip \
            --title "MediaPrimeKey ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
